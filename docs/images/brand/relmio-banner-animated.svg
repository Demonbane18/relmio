<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Relmio — one wizard, clear AI boundaries</title>
  <desc id="description">The Relmio gateway mark connects separate Platform API and private Codex routes without mixing credentials.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#071b16"/>
      <stop offset="1" stop-color="#102c25"/>
    </linearGradient>
    <linearGradient id="door" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#20b7aa"/>
      <stop offset="1" stop-color="#087f77"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <path d="M34 54h202M34 266h202M964 54h202M964 266h202" stroke="#2a5c50" stroke-width="2" stroke-dasharray="8 12"/>

  <g opacity=".72" fill="none" stroke-linecap="round">
    <path d="M52 109h197l72 51h86" stroke="#1a8f82" stroke-width="3"/>
    <path d="M52 211h197l72-51h86" stroke="#b97722" stroke-width="3"/>
    <path d="M793 160h86l72-51h197" stroke="#1a8f82" stroke-width="3"/>
    <path d="M793 160h86l72 51h197" stroke="#b97722" stroke-width="3"/>
  </g>

  <g fill="#e8f7f2">
    <circle cx="52" cy="109" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="52" cy="211" r="5"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1148" cy="109" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="2.6s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="1148" cy="211" r="5"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" begin=".5s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(452 34)">
    <path d="M22 242V116C22 49 66 6 148 6s126 43 126 110v126" fill="#f6f0e6"/>
    <path d="M72 242V126c0-45 26-73 76-73s76 28 76 73v116" fill="url(#door)"/>
    <circle cx="123" cy="120" r="11" fill="#f6f0e6"/>
    <circle cx="173" cy="120" r="11" fill="#f6f0e6"/>
    <path d="M103 174c24 20 66 20 90 0" fill="none" stroke="#d6fff8" stroke-width="5" stroke-linecap="round" opacity=".75"/>
    <ellipse cx="148" cy="250" rx="82" ry="10" fill="#0ce0cc" opacity=".18" filter="url(#glow)">
      <animate attributeName="rx" values="66;90;66" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.32;.1" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f6f0e6">
    <text x="56" y="77" font-size="18" letter-spacing="3" fill="#49cfc1">SUPPORTED API</text>
    <text x="56" y="190" font-size="18" letter-spacing="3" fill="#e1a34f">PRIVATE EXPERIMENTAL</text>
    <text x="825" y="88" font-size="56" font-weight="700">Relmio</text>
    <text x="825" y="130" font-size="23" fill="#b7d2c9">One wizard. Clear boundaries.</text>
    <text x="825" y="192" font-size="18" fill="#f6f0e6">Connect AI tools without mixing credentials.</text>
    <text x="825" y="226" font-size="15" fill="#8db3a7">Local endpoints · n8n companions · Codex tools</text>
  </g>
</svg>
