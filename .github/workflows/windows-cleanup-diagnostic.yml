name: Windows cleanup diagnostic

on:
  push:
    branches:
      - codex/windows-cleanup-investigation

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Repeat unchanged portable-runtime cleanup with diagnostics
        shell: pwsh
        run: |
          $failures = 0
          1..12 | ForEach-Object {
            Write-Output "Native cleanup attempt $_ of 12"
            node --test --test-name-pattern="CMD installer downloads, verifies, extracts, and removes a temporary runtime when Node is old" test/install-cmd-script.test.js
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -gt 0) { throw "$failures native cleanup attempts failed" }
